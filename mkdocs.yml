site_name: DAM
site_url: https://pages.github.ibm.com/dam-agents/docs/

theme:
  name: material
  custom_dir: overrides
  favicon: assets/Favicon.png
  palette:
    - scheme: default
      primary: white
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy
    - header.autohide

extra_css:
  - stylesheets/extra.css

extra:
  generator: false

plugins:
  - search

markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - toc:
      permalink: true

docs_dir: docs
site_dir: site

nav:
  - Getting Started:
    - Welcome: index.md
    - Quickstart: getting-started/quickstart.md
  - Use Cases:
    - Web App Development: use-cases/web-app-development.md
    - Code Review: use-cases/code-review.md
    - Broken Link Monitor: use-cases/broken-link-monitor.md
  - Core Concepts:
    - Agents & Harnesses: core-concepts/agents.md
    - Sessions: core-concepts/sessions.md
    - Connections: core-concepts/connections.md
    - Network & Approvals: core-concepts/network-access.md
    - Skills & Tools: core-concepts/skills-and-tools.md
    - Schedules: core-concepts/schedules.md
    - File Manager: core-concepts/file-manager.md
    - Slack: integrations/slack.md
  - Guides:
    - How to Create a LiteLLM Key: guides/litellm-key.md
    - Building a Custom Image: guides/custom-harness.md
  - Reference:
    - Architecture: reference/architecture.md
    - CLI: reference/cli.md
    - Contact: reference/contact.md
