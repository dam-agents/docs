site_name: DAM
site_url: https://dam-agents.github.io/docs/
site_description: Documentation for DAM, an open platform for running long-lived AI agents, built at IBM Research.
repo_url: https://github.com/dam-agents/docs
repo_name: dam-agents/docs
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  palette:
    - scheme: default
      primary: white
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy
    - content.action.edit
    - header.autohide

extra_css:
  - stylesheets/extra.css

extra:
  generator: false

plugins:
  - search

markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - toc:
      permalink: true

docs_dir: docs
site_dir: site

# Kept in the repo but deliberately out of the nav. These read as generic
# "yet another coding tool" walkthroughs; retained for anyone holding a direct link.
not_in_nav: |
  getting-started/welcome.md
  guides/broken-link-monitor.md
  guides/external.md

nav:
  - Getting Started:
    - Welcome: index.md
    - Quickstart: getting-started/quickstart.md
    - DAM new user tour: getting-started/tour.md
  - Guides:
    - Building knowledge bases: guides/building-knowledge-bases.md
    - Automate PR review: guides/code-review.md
    - Run Nous campaigns: guides/run-nous.md
    - Kubernetes cluster health monitor: guides/k8s-cluster-health.md
    - Create your own starter kit: guides/create-starter-kit.md
  - Core Concepts:
    - The building blocks: core-concepts/building-blocks.md
    - Agents: core-concepts/agents.md
    - Sessions: core-concepts/sessions.md
    - Connections: core-concepts/connections.md
    - Schedules: core-concepts/schedules.md
    - Artifacts: core-concepts/artifacts.md
    - Skills: core-concepts/skills.md
    - File manager: core-concepts/file-manager.md
    - Network & approvals: core-concepts/network-access.md
    - Sub-agents: core-concepts/sub-agents.md
    - Satellites (experimental): core-concepts/satellites.md
  - Integrations:
    - Slack: integrations/slack.md
    - Telegram: integrations/telegram.md
    - VS Code/Zed (SSH): integrations/vs-code-zed-ssh.md
  - Reference:
    - Architecture: reference/architecture.md
    - CLI: reference/cli.md
    - Create your LiteLLM key: reference/litellm-key.md
    - Roadmap: reference/roadmap.md
  - Help:
    - "#dam-community (IBM Slack) ↗": https://ibm.enterprise.slack.com/archives/C0B3F03NB24
    - "DAM status (IBM hosted) ↗": https://ibm.biz/dam-status
    - Contact: reference/contact.md
