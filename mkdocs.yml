site_name: DAM
site_url: https://pages.github.ibm.com/dam-agents/docs/

theme:
  name: material
  custom_dir: overrides
  palette:
    - scheme: default
      primary: white
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy
    - header.autohide

extra_css:
  - stylesheets/extra.css

extra:
  generator: false

plugins:
  - search

markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - toc:
      permalink: true

docs_dir: docs
site_dir: site

# Kept in the repo but deliberately out of the nav. These two read as generic
# "yet another coding tool" walkthroughs; retained for anyone holding a direct link.
not_in_nav: |
  guides/web-app-development.md
  guides/broken-link-monitor.md
  guides/external.md
  guides/building-knowledge-bases.md
  guides/run-experiments.md

nav:
  - Getting Started:
    - Welcome: getting-started/welcome.md
    - Quickstart: getting-started/quickstart.md
    - DAM new user tour: getting-started/tour.md
  - Guides:
    - Automate PR review: guides/code-review.md
  - Core Concepts:
    - The building blocks: core-concepts/building-blocks.md
    - Agents: core-concepts/agents.md
    - Sessions: core-concepts/sessions.md
    - Connections: core-concepts/connections.md
    - Network & approvals: core-concepts/network-access.md
    - Skills: core-concepts/skills.md
    - Schedules: core-concepts/schedules.md
    - File manager: core-concepts/file-manager.md
    - Experiments: core-concepts/experiments.md
    - Knowledge bases: core-concepts/knowledge-bases.md
    - Artifacts: core-concepts/artifacts.md
  - Integrations:
    - Slack: integrations/slack.md
    - Telegram: integrations/telegram.md
    - VS Code/Zed (SSH): integrations/vs-code-zed-ssh.md
  - Reference:
    - Architecture: reference/architecture.md
    - CLI: reference/cli.md
    - Create your LiteLLM key: reference/litellm-key.md
    - Building a custom image: guides/custom-image.md
    - Contact: reference/contact.md
