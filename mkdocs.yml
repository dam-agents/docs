site_name: DAM
site_url: https://pages.github.ibm.com/dam-agents/docs/

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo-light.png
  favicon: assets/logo-light.png
  palette:
    - scheme: default
      primary: white
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy
    - header.autohide

extra_css:
  - stylesheets/extra.css

extra:
  generator: false

plugins:
  - search

markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - toc:
      permalink: true

docs_dir: docs
site_dir: site

nav:
  - Getting Started:
    - Welcome: index.md
    - Quickstart: getting-started/quickstart.md
  - Agents:
    - Overview: agents/overview.md
    - Claude Code: agents/claude-code.md
    - Pi Agent: agents/pi-agent.md
    - Bob: agents/bob.md
    - Codex: agents/codex.md
  - Features:
    - Sessions: features/sessions.md
    - Connections: features/connections.md
    - Network & Approvals: features/network-access.md
    - Skills & Tools: features/skills-and-tools.md
    - Schedules: features/schedules.md
    - File Manager: features/file-manager.md
    - Multiplayer: features/multiplayer.md
    - Slack: integrations/slack.md
  - Guides:
    - Custom Harness Image: guides/custom-harness.md
  - Reference:
    - Architecture: reference/architecture.md
    - CLI: reference/cli.md
    - Glossary: reference/glossary.md
    - FAQ: reference/faq.md
    - Troubleshooting: reference/troubleshooting.md
    - Contact: reference/contact.md
